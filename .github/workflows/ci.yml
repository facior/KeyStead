# Testy aplikacji na Windows, macOS i Linuksie (gałęzie testowe port/** i wydania).
name: ci

on:
  push:
    branches: ["port/**", "main"]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Linux – biblioteki okien i schowka
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xclip libxkbcommon-x11-0 libxcb-xinerama0 fonts-dejavu-core
      - name: Zależności
        run: python -m pip install -r requirements.txt
      - name: Testy (Linux, wirtualny ekran)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python tests/run_all.py
      - name: Testy
        if: runner.os != 'Linux'
        run: python tests/run_all.py

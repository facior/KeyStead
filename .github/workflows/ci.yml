# Testy aplikacji na Windows, macOS i Linuksie (gałęzie testowe port/** i wydania).
name: ci

on:
  push:
    branches: ["port/**", "main"]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Linux – biblioteki okien i schowka
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xclip libxkbcommon-x11-0 libxcb-xinerama0 fonts-dejavu-core libpcsclite-dev swig
      - name: Windows – ekran 1920x1080 (testy układu okna zakładają typowy monitor)
        if: runner.os == 'Windows'
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Zależności
        run: python -m pip install -r requirements.txt
      - name: Testy (Linux, wirtualny ekran)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -X faulthandler tests/run_all.py -v
      - name: Testy
        if: runner.os != 'Linux'
        run: python -X faulthandler tests/run_all.py -v

  screenshots:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Linux – biblioteki okien
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xclip libxkbcommon-x11-0 fonts-dejavu-core fonts-noto-color-emoji libpcsclite-dev swig
      - name: Zależności
        run: python -m pip install -r requirements.txt
      - name: Zrzuty ekranu (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python .github/scripts/ui_tour.py shots
      - name: Zrzuty ekranu (macOS)
        if: runner.os == 'macOS'
        run: python .github/scripts/ui_tour.py shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: shots

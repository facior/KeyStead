# Budowanie wersji na macOS (DMG, Apple Silicon) i Linuksa (AppImage). Pliki trafiają do artefaktów przebiegu;
# podpisuje je i publikuje tools/release_app.py na komputerze wydawcy (klucz nie jest przechowywany w GitHub).
name: build

on:
  push:
    branches: ["port/**"]
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Zależności
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Budowanie DMG
        run: python packaging/build_desktop.py out
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*.dmg
          if-no-files-found: error

  linux:
    # Starsze Ubuntu = starsza biblioteka C: AppImage działa także na starszych dystrybucjach
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Biblioteki systemowe
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev swig
      - name: Zależności
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Budowanie AppImage
        run: python packaging/build_desktop.py out
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*.AppImage
          if-no-files-found: error
